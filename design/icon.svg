<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GigaControl">
  <defs>
    <!-- rounded app tile -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3f"/>
      <stop offset="1" stop-color="#222226"/>
    </linearGradient>
    <!-- per-blade spectrum fills (the "RGB" half of the story) -->
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5b5b"/><stop offset="1" stop-color="#e01b24"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd23f"/><stop offset="1" stop-color="#e5a50a"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4dd48a"/><stop offset="1" stop-color="#26a269"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#66b2ff"/><stop offset="1" stop-color="#1f6fe5"/></linearGradient>
    <radialGradient id="hub" cx="50%" cy="42%" r="60%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9ccd3"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#tile)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- four swept fan blades, each a different spectrum color; rotated around the hub -->
  <g transform="translate(64 64)" filter="url(#soft)">
    <g>
      <path d="M0,-6 C22,-14 40,-10 44,4 C34,2 20,-2 6,-4 Z" fill="url(#b4)" transform="rotate(0)"/>
      <path d="M0,-6 C22,-14 40,-10 44,4 C34,2 20,-2 6,-4 Z" fill="url(#b3)" transform="rotate(90)"/>
      <path d="M0,-6 C22,-14 40,-10 44,4 C34,2 20,-2 6,-4 Z" fill="url(#b2)" transform="rotate(180)"/>
      <path d="M0,-6 C22,-14 40,-10 44,4 C34,2 20,-2 6,-4 Z" fill="url(#b1)" transform="rotate(270)"/>
    </g>
    <circle r="11" fill="url(#hub)"/>
    <circle r="4" fill="#4a4d55"/>
  </g>
</svg>
