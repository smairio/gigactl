<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root (the daemon) may own the name and run its methods. -->
  <policy user="root">
    <allow own="io.github.smairio.gigactl"/>
    <allow send_destination="io.github.smairio.gigactl"/>
  </policy>

  <!-- Everyone may read: call the interface and receive its signals.
       Write access is gated by polkit inside the daemon (ticket #13),
       not here. -->
  <policy context="default">
    <allow send_destination="io.github.smairio.gigactl"
           send_interface="io.github.smairio.gigactl.Control"/>
    <allow send_destination="io.github.smairio.gigactl"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.smairio.gigactl"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow receive_sender="io.github.smairio.gigactl"/>
  </policy>
</busconfig>
